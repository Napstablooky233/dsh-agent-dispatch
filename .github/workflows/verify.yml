name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: the repository has no dependencies and no lockfile.
      - name: verify
        run: npm run verify
      - name: Verify i18n outside the checkout directory
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/check-i18n.mjs"
