url: https://github.com/Napstablooky233/dsh-agent-dispatch
name: Napstablooky233/dsh-agent-dispatch
category: workflow
description:
  en: A settings panel that decides whether the main agent may delegate work and which helpers may join, sends low-risk mechanical blocks out on the agent's own initiative while teams, experts, paid lanes and writes still ask first, estimates before every run whether the work can be split, reassigns a stalled helper's block, and injects that division of labor into the systemPrompt section on every step.
  zh: 一块设置面板，决定主 agent 要不要派活、准哪几个帮手上场；低风险的机械活由它自己主动派出去，建队、召唤专家、付费车道、写盘发布仍然先问一句；每次动工前先估一句能否拆开，帮手卡住时怎么改派，把这条分工策略注入 systemPrompt 段，保存即生效。
